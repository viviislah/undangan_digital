<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Facth Printing - Undangan Digital</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Preserves hash and query params
      var path = window.location.pathname;
      var repoMatch = path.match(/^\/([^\/]+)/);
      var basePath = repoMatch ? '/' + repoMatch[1] + '/' : '/';
      window.location.replace(basePath + window.location.search + window.location.hash);
    </script>
  </head>
  <body>
    <p>Mengalihkan ke halaman undangan...</p>
  </body>
</html>
